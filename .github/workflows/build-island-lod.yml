name: Preparar texturas leves das ilhas
on:
  push:
    branches: [main]
    paths:
      - tools/build_island_lod.py
      - .github/workflows/build-island-lod.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brumaria-texture-lod
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python tools/build_island_lod.py
      - name: Validar e adicionar previews WebP ao repositório
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          from PIL import Image
          root=pathlib.Path('assets/textures/terrain')
          manifest=json.loads((root/'manifest.json').read_text())
          for entry in manifest['distance_lod']['variants'].values():
              file=root/entry['filename']
              data=file.read_bytes()
              assert len(data)==entry['bytes']
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              with Image.open(file) as image: assert image.size==(512,512)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/textures/terrain/manifest.json assets/textures/terrain/*_diff_low.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(terrain): ship five lightweight 512px LOD previews'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
