name: Instalar texturas CC0 Poly Haven

on:
  push:
    branches: [main]
    paths:
      - tools/import_polyhaven_textures.py
      - .github/workflows/install-terrain-textures.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brumaria-install-cc0-terrain
  cancel-in-progress: false

jobs:
  fetch-and-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow para otimizar texturas PBR
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Baixar mapas de imagens oficiais CC0 e gerar variantes locais WebP
        run: python tools/import_polyhaven_textures.py
      - name: Validar mapas, limites e licencas antes de publicar
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          root=pathlib.Path('assets/textures/terrain')
          m=json.loads((root/'manifest.json').read_text())
          assert m['license']=='CC0-1.0' and len(m['materials'])==5
          for name,item in m['materials'].items():
              assert item['page'].startswith('https://polyhaven.com/a/')
              for channel in ('diff','normal'):
                  for tier,maxsize in (('mobile',1024),('desktop',2048)):
                      p=root/f'{name}_{channel}_{tier}.webp'
                      assert p.is_file(),p
                      with Image.open(p) as img:
                          assert img.format=='WEBP'
                          assert 768<=max(img.size)<=maxsize
              print(name,'OK')
          print('POLYHAVEN_TEXTURES_VERIFIED')
          PY
      - name: Salvar no jogo, sem depender da internet durante a partida
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/textures/terrain
          if git diff --cached --quiet; then
            echo 'Todos os materiais já estavam atualizados.'
          else
            git commit -m 'assets(terrain): install 20 locally-hosted Poly Haven CC0 PBR WebP maps'
            git push origin HEAD:main
          fi
