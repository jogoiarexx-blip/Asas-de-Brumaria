name: Verificar Asas de Brumaria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe imports HUD e regressao
        run: npm run check

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Three.js local e navegador para QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.180.0
          npx playwright install --with-deps chromium
          mkdir -p vendor
          cp node_modules/three/build/three.module.js vendor/three.module.js
          cp node_modules/three/build/three.core.js vendor/three.core.js
      - name: Simular partida no Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/brumaria-server.log 2>&1 &
          # Run all scenarios even if one fails, so a single timeout cannot
          # conceal defects in missions, mountain, textures or performance.
          failures=0
          for script in tests/browser-main-menu.mjs tests/browser-smoke.mjs tests/browser-camera-movement.mjs tests/browser-hero-mounted.mjs tests/browser-hero-saddle.mjs tests/browser-frontier-encounters.mjs tests/browser-fury-assets.mjs tests/browser-fury-auto.mjs tests/browser-missions.mjs tests/browser-mountain.mjs tests/browser-performance.mjs tests/browser-terrain-stream-queue.mjs tests/browser-terrain-textures.mjs tests/browser-island-detail-stream.mjs tests/browser-prefetch-spatial-v1425.mjs tests/browser-v151-upgrades.mjs tests/browser-island-scale-v153.mjs tests/browser-webp-hlod-v155.mjs; do
            echo "::group::QA $script"
            node "$script" || failures=$((failures+1))
            echo "::endgroup::"
          done
          echo "Falhas em scripts de navegador: $failures"
          test "$failures" -eq 0
      - name: Salvar captura de tela do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brumaria-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
